name: Publicar asset de ToolHub

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: toolhub-assets-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[ToolHub Asset]')
    runs-on: ubuntu-latest

    steps:
      - name: Validar y añadir asset a data/assets.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const issueNumber = Number(process.env.ISSUE_NUMBER);
          const branch = process.env.DEFAULT_BRANCH || 'main';
          const issueBody = process.env.ISSUE_BODY || '';
          const api = 'https://api.github.com';

          if (!token || !repository || !issueNumber) {
            throw new Error('Faltan datos del entorno de GitHub Actions.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'ToolHub-Asset-Publisher',
            'Content-Type': 'application/json'
          };

          async function github(path, options = {}) {
            const response = await fetch(`${api}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });

            const text = await response.text();
            let payload = null;
            if (text) {
              try { payload = JSON.parse(text); }
              catch { payload = text; }
            }

            if (!response.ok) {
              const detail = payload?.message || String(payload || '').slice(0, 300) || `HTTP ${response.status}`;
              throw new Error(`GitHub API ${response.status}: ${detail}`);
            }
            return payload;
          }

          function value(value, max, required, label) {
            const result = String(value ?? '').trim();
            if (required && !result) throw new Error(`${label} es obligatorio.`);
            if (result.length > max) throw new Error(`${label} supera ${max} caracteres.`);
            return result;
          }

          function url(valueToCheck, required, label) {
            const raw = String(valueToCheck ?? '').trim();
            if (!raw && !required) return '';
            if (!raw && required) throw new Error(`${label} es obligatorio.`);
            let parsed;
            try { parsed = new URL(raw); }
            catch { throw new Error(`${label} no es una URL válida.`); }
            if (!['http:', 'https:'].includes(parsed.protocol)) {
              throw new Error(`${label} debe usar http o https.`);
            }
            return parsed.href;
          }

          function tags(input) {
            if (!Array.isArray(input)) return [];
            return [...new Set(input
              .map((tag) => String(tag).trim().toLowerCase())
              .filter(Boolean)
              .map((tag) => tag.slice(0, 32)))].slice(0, 20);
          }

          async function comment(message) {
            await github(`/repos/${repository}/issues/${issueNumber}/comments`, {
              method: 'POST',
              body: JSON.stringify({ body: message })
            });
          }

          async function closeIssue() {
            await github(`/repos/${repository}/issues/${issueNumber}`, {
              method: 'PATCH',
              body: JSON.stringify({ state: 'closed', state_reason: 'completed' })
            });
          }

          async function main() {
            const startMarker = '<!-- TOOLHUB_ASSET_START -->';
            const endMarker = '<!-- TOOLHUB_ASSET_END -->';
            const start = issueBody.indexOf(startMarker);
            const end = issueBody.indexOf(endMarker);

            if (start < 0 || end < 0 || end <= start) {
              throw new Error('La solicitud no contiene los datos de ToolHub.');
            }

            let raw = issueBody.slice(start + startMarker.length, end).trim();
            raw = raw.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();

            let input;
            try { input = JSON.parse(raw); }
            catch { throw new Error('El bloque JSON de la solicitud no es válido.'); }

            const categories = new Set(['Avatar', 'Ropa', 'Pelo', 'Accesorio', 'Shader', 'Textura', 'Prefab', 'Animación', 'Herramienta', 'Otro']);
            const platforms = new Set(['PC', 'Quest / Android', 'PC + Quest', 'No especificado']);

            const category = value(input.category, 40, true, 'Categoría');
            const platform = value(input.platform || 'No especificado', 40, true, 'Compatibilidad');
            if (!categories.has(category)) throw new Error('Categoría no permitida.');
            if (!platforms.has(platform)) throw new Error('Compatibilidad no permitida.');

            const asset = {
              id: `asset-gh-${issueNumber}`,
              name: value(input.name, 90, true, 'Nombre'),
              category,
              author: value(input.author, 70, false, 'Autor'),
              platform,
              authorUrl: url(input.authorUrl, true, 'Enlace de autor/origen'),
              preview: url(input.preview, false, 'Preview'),
              downloadUrl: url(input.downloadUrl, true, 'Enlace de descarga'),
              tags: tags(input.tags),
              description: value(input.description, 500, false, 'Descripción'),
              createdAt: new Date().toISOString(),
              sourceIssue: issueNumber
            };

            const file = await github(`/repos/${repository}/contents/data/assets.json?ref=${encodeURIComponent(branch)}`);
            const decoded = Buffer.from(String(file.content || '').replace(/\s+/g, ''), 'base64').toString('utf8');
            const catalog = JSON.parse(decoded || '[]');
            if (!Array.isArray(catalog)) throw new Error('data/assets.json no contiene un array.');

            if (catalog.some((item) => item?.id === asset.id || Number(item?.sourceIssue) === issueNumber)) {
              await comment('✅ Esta solicitud ya estaba publicada en la Biblioteca de Assets.');
              await closeIssue();
              return;
            }

            const next = [asset, ...catalog];
            const content = Buffer.from(`${JSON.stringify(next, null, 2)}\n`, 'utf8').toString('base64');

            await github(`/repos/${repository}/contents/data/assets.json`, {
              method: 'PUT',
              body: JSON.stringify({
                message: `ToolHub: publicar ${asset.name}`,
                content,
                sha: file.sha,
                branch
              })
            });

            await comment(`✅ **${asset.name}** se añadió automáticamente a \`data/assets.json\`. GitHub Pages lo mostrará cuando termine de actualizar.`);
            await closeIssue();
          }

          main().catch(async (error) => {
            console.error(error);
            const safeMessage = String(error?.message || error).replace(/`/g, "'").slice(0, 600);
            try {
              await comment(`❌ ToolHub no pudo publicar esta ficha: **${safeMessage}**\n\nCorrige la solicitud y vuelve a editarla para reintentarlo.`);
            } catch (commentError) {
              console.error('No se pudo comentar el error:', commentError);
            }
            process.exitCode = 1;
          });
          NODE
