<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匚尺丨丂 — Tarjeta 3D</title>
<style>
:root{--text:#f7f8fb;--muted:rgba(255,255,255,.72);--soft:rgba(255,255,255,.48)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:0;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:block;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.scene{width:100%;height:100%;max-width:none;display:grid;place-items:center;perspective:1450px}
.card{
  --rx:0deg;--ry:0deg;--fg-x:0px;--fg-y:0px;--bg-x:0px;--bg-y:0px;
  position:relative;width:100%;height:100%;aspect-ratio:auto;overflow:hidden;border-radius:28px;
  transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));will-change:transform;
  background:#0b0f15;box-shadow:none
}
.layer-2-background{
  position:absolute;inset:-1.8%;z-index:1;width:103.6%;height:103.6%;
  object-fit:cover;object-position:center;pointer-events:none;user-select:none;
  transform:translate3d(var(--bg-x),var(--bg-y),-34px) scale(1.015);
  filter:saturate(.98) contrast(1.01);will-change:transform
}
.depth-shadow{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 31% 52%,rgba(0,0,0,.10) 0%,rgba(0,0,0,.035) 27%,transparent 48%)
}
.layer-1{
  position:absolute;inset:0;z-index:3;transform-style:preserve-3d;
  transform:translate3d(var(--fg-x),var(--fg-y),66px);will-change:transform;pointer-events:none
}
.character{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
  pointer-events:none;user-select:none;
  filter:drop-shadow(0 14px 16px rgba(0,0,0,.20)) drop-shadow(0 2px 4px rgba(0,0,0,.12))
}
.profile{
  position:absolute;right:5.2%;top:50%;width:min(43%,610px);
  transform:translateY(-50%) translateZ(8px);padding:27px 29px;
  border:1px solid rgba(255,255,255,.11);border-radius:24px;
  background:linear-gradient(145deg,rgba(7,10,16,.18),rgba(7,10,16,.07));
  -webkit-backdrop-filter:blur(3px) saturate(1.02);backdrop-filter:blur(3px) saturate(1.02);
  box-shadow:0 16px 34px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.05);
  color:var(--text);pointer-events:auto
}
.kicker{margin:0 0 7px;color:var(--soft);font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.title{margin:0;font-size:clamp(44px,5.3vw,77px);line-height:.95;letter-spacing:-.035em;font-weight:850;color:#fff}
.subtitle{margin:10px 0 0;color:rgba(255,255,255,.90);font-size:clamp(16px,1.8vw,22px);font-weight:750}
.quote{display:block;margin-top:18px;padding-left:14px;border-left:2px solid rgba(255,255,255,.28);color:rgba(255,255,255,.78);font-size:13px;line-height:1.6;text-decoration:none;transition:color .18s ease,border-color .18s ease}
.quote:hover{color:#fff;border-left-color:rgba(255,255,255,.76)}
.description{margin:19px 0 0;color:rgba(255,255,255,.90);font-size:15px;line-height:1.6}
.section-label{margin:21px 0 10px;color:rgba(255,255,255,.54);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skill{padding:8px 11px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.045);color:rgba(255,255,255,.90);font-size:11px;font-weight:750}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.social{min-height:45px;display:inline-flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.045);color:rgba(255,255,255,.92);text-decoration:none;transition:transform .18s ease,border-color .18s ease,background .18s ease}
.social:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.30);background:rgba(255,255,255,.08)}
.social-icon{width:23px;height:23px;flex:0 0 23px}.social-icon svg{width:100%;height:100%;display:block}
.social-text{display:flex;flex-direction:column;line-height:1.05}
.social-text small{margin-bottom:3px;color:rgba(255,255,255,.47);font-size:9px;letter-spacing:.10em;text-transform:uppercase;font-weight:800}
.social-text strong{color:#fff;font-size:12px;font-weight:800}
.card-edge{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 42px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.045)}
@media(max-width:820px){.profile{right:4%;width:52%;padding:21px}.title{font-size:clamp(36px,7vw,60px)}}
@media(max-width:650px){.layer-2-background,.character{object-position:43% center}.profile{left:5%;right:5%;top:auto;bottom:5%;width:auto;transform:none}}
@media(prefers-reduced-motion:reduce){.card,.layer-1,.layer-2-background{transform:none!important}}
</style>
</head>
<body>
<div class="scene">
  <article class="card" id="card">
    <img class="layer-2-background" id="crisCardBackground" src="" alt="" aria-hidden="true" draggable="false">
    <div class="depth-shadow" aria-hidden="true"></div>
    <div class="layer-1">
      <img class="character" src="Cris&Arceus2.png" alt="CRIS" draggable="false">
      <section class="profile" aria-label="Perfil de CRIS">
        <p class="kicker">Creator Profile</p>
        <h1 class="title">匚尺丨丂</h1>
        <p class="subtitle">Owner Web</p>
        <a class="quote" href="https://freakuotes.com/frase/89194/lelouch-vi-britannia-code-geass" target="_blank" rel="noopener noreferrer">“Lo difícil no es hacer lo correcto, lo difícil es saber que es lo correcto.”</a>
        <p class="description">Avatar Creator and web creator</p>
        <p class="section-label">Tools &amp; Skills</p>
        <div class="skills"><span class="skill">Unity</span><span class="skill">Blender</span><span class="skill">VRChat Avatars</span><span class="skill">Poiyomi</span><span class="skill">HTML</span><span class="skill">CSS</span><span class="skill">JavaScript</span><span class="skill">Web UI</span><span class="skill">Texturing</span></div>
        <div class="socials">
          <a class="social" href="https://vrchat.com/home/user/usr_fba85e6f-5621-4f17-8c95-c378dee67190" target="_blank" rel="noopener noreferrer" aria-label="Abrir perfil de VRChat"><span class="social-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="16" rx="4" stroke="currentColor" stroke-width="1.8"/><path d="M7 9.2 9.7 14 12 10.3 14.3 14 17 9.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="social-text"><small>VRChat</small><strong>Ver perfil</strong></span></a>
          <div class="social" aria-label="Discord: cris__ta"><span class="social-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7.2 7.2c3.1-1.4 6.5-1.4 9.6 0 1.5 2 2.5 4.4 2.7 6.9-1.2 1.5-2.7 2.5-4.4 3.2l-1.1-1.5c.6-.2 1.1-.5 1.6-.8-2.3 1-4.9 1-7.2 0 .5.3 1 .6 1.6.8l-1.1 1.5c-1.7-.7-3.2-1.7-4.4-3.2.2-2.5 1.2-4.9 2.7-6.9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="9.3" cy="12.1" r="1" fill="currentColor"/><circle cx="14.7" cy="12.1" r="1" fill="currentColor"/></svg></span><span class="social-text"><small>Discord</small><strong>cris__ta</strong></span></div>
        </div>
      </section>
    </div>
    <div class="card-edge" aria-hidden="true"></div>
  </article>
</div>
  <script>
  (()=>{
    const orb=document.getElementById('orb'), modal=document.getElementById('modal'), frame=document.getElementById('frame'), close=document.getElementById('close');
    let cardUrl='';
    const neutral=()=>{orb.style.setProperty('--tx','0deg');orb.style.setProperty('--ty','0deg');orb.style.setProperty('--sx','0px');orb.style.setProperty('--sy','0px')};
    addEventListener('pointermove',e=>{
      if(modal.classList.contains('open')) return;
      const r=orb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const nx=Math.max(-1,Math.min(1,(e.clientX-cx)/(innerWidth*.46)));
      const ny=Math.max(-1,Math.min(1,(e.clientY-cy)/(innerHeight*.46)));
      orb.style.setProperty('--tx',(-ny*4.2).toFixed(2)+'deg');
      orb.style.setProperty('--ty',(nx*4.2).toFixed(2)+'deg');
      orb.style.setProperty('--sx',(nx*2.2).toFixed(2)+'px');
      orb.style.setProperty('--sy',(ny*2.2).toFixed(2)+'px');
    },{passive:true});
    const ensureCard=()=>{
      if(cardUrl) return;
      const b64=document.getElementById('cardData').textContent.trim();
      const bin=atob(b64), bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      cardUrl=URL.createObjectURL(new Blob([bytes],{type:'text/html;charset=utf-8'}));
      frame.src=cardUrl;
    };
    const open=()=>{ensureCard();modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');neutral();setTimeout(()=>close.focus(),30)};
    const shut=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');orb.focus({preventScroll:true})};
    orb.addEventListener('click',open); close.addEventListener('click',shut); document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))shut()}); addEventListener('blur',neutral);
    addEventListener('beforeunload',()=>{if(cardUrl)URL.revokeObjectURL(cardUrl)});
  })();
  </script>
</body>
</html>
