<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>匚尺丨丂 — Tarjeta 3D</title>
<style>
:root{--text:#f7f8fb;--soft:rgba(255,255,255,.52)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.scene{width:100%;height:100%;display:grid;place-items:center;perspective:1600px}
.card{
  --rx:0deg;--ry:0deg;--fg-x:0px;--fg-y:0px;--bg-x:0px;--bg-y:0px;
  --light-x:50%;--light-y:35%;
  position:relative;width:100%;height:100%;overflow:hidden;border-radius:28px;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(.994);
  background:#081018;
  box-shadow:0 30px 75px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.06);
  will-change:transform
}
.layer-2-background{
  position:absolute;inset:-4%;width:108%;height:108%;z-index:1;
  object-fit:cover;object-position:center;user-select:none;pointer-events:none;
  transform:translate3d(var(--bg-x),var(--bg-y),-70px) scale(1.045);
  filter:saturate(1.02) contrast(1.02) brightness(.96);
  will-change:transform
}
.depth-vignette{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(circle at var(--light-x) var(--light-y),rgba(255,255,255,.055),transparent 31%),
    linear-gradient(90deg,rgba(0,0,0,.10),transparent 38%,rgba(0,0,0,.04));
}
.layer-1{
  position:absolute;inset:0;z-index:3;transform-style:preserve-3d;
  transform:translate3d(var(--fg-x),var(--fg-y),92px) scale(1.008);
  will-change:transform;pointer-events:none
}
.character{
  position:absolute;inset:-1.2%;width:102.4%;height:102.4%;
  object-fit:cover;object-position:center;pointer-events:none;user-select:none;
  filter:drop-shadow(0 18px 22px rgba(0,0,0,.34)) drop-shadow(0 3px 5px rgba(0,0,0,.22));
}
.profile{
  position:absolute;right:5.2%;top:50%;width:min(43%,610px);
  transform:translateY(-50%) translateZ(24px);
  padding:27px 29px;border:1px solid rgba(255,255,255,.14);border-radius:24px;
  background:linear-gradient(145deg,rgba(7,10,16,.29),rgba(7,10,16,.13));
  -webkit-backdrop-filter:blur(7px) saturate(1.08);
  backdrop-filter:blur(7px) saturate(1.08);
  box-shadow:0 18px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.07);
  color:var(--text);pointer-events:auto
}
.kicker{margin:0 0 7px;color:var(--soft);font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.title{margin:0;font-size:clamp(44px,5.3vw,77px);line-height:.95;letter-spacing:-.035em;font-weight:850;color:#fff}
.subtitle{margin:10px 0 0;color:rgba(255,255,255,.92);font-size:clamp(16px,1.8vw,22px);font-weight:750}
.quote{display:block;margin-top:18px;padding-left:14px;border-left:2px solid rgba(255,255,255,.30);color:rgba(255,255,255,.80);font-size:13px;line-height:1.6;text-decoration:none;transition:.18s}
.quote:hover{color:#fff;border-left-color:rgba(255,255,255,.8)}
.description{margin:19px 0 0;color:rgba(255,255,255,.92);font-size:15px;line-height:1.6}
.section-label{margin:21px 0 10px;color:rgba(255,255,255,.56);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skill{padding:8px 11px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(255,255,255,.055);color:rgba(255,255,255,.92);font-size:11px;font-weight:750}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.social{min-height:45px;display:inline-flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(255,255,255,.055);color:rgba(255,255,255,.94);text-decoration:none;transition:.18s}
.social:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.09)}
.social-icon{width:23px;height:23px;flex:0 0 23px}.social-icon svg{width:100%;height:100%;display:block}
.social-text{display:flex;flex-direction:column;line-height:1.05}
.social-text small{margin-bottom:3px;color:rgba(255,255,255,.49);font-size:9px;letter-spacing:.10em;text-transform:uppercase;font-weight:800}
.social-text strong{color:#fff;font-size:12px;font-weight:800}
.card-edge{position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 55px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.055)}
@media(max-width:820px){.profile{right:4%;width:52%;padding:21px}.title{font-size:clamp(36px,7vw,60px)}}
@media(max-width:650px){.profile{left:5%;right:5%;top:auto;bottom:5%;width:auto;transform:translateZ(24px)}}
@media(prefers-reduced-motion:reduce){.card,.layer-1,.layer-2-background{transform:none!important}}
</style>
</head>
<body>
<div class="scene">
<article class="card" id="card">
  <img class="layer-2-background" id="crisCardBackground" src="" alt="" aria-hidden="true" draggable="false">
  <div class="depth-vignette" aria-hidden="true"></div>
  <div class="layer-1">
    <img class="character" src="cris-card-character.webp?v=cris-layers-5" alt="CRIS" draggable="false">
    <section class="profile" aria-label="Perfil de CRIS">
      <p class="kicker">Creator Profile</p>
      <h1 class="title">匚尺丨丂</h1>
      <p class="subtitle">Owner Web</p>
      <a class="quote" href="https://freakuotes.com/frase/89194/lelouch-vi-britannia-code-geass" target="_blank" rel="noopener noreferrer">“Lo difícil no es hacer lo correcto, lo difícil es saber que es lo correcto.”</a>
      <p class="description">Avatar Creator and web creator</p>
      <p class="section-label">Tools &amp; Skills</p>
      <div class="skills">
        <span class="skill">Unity</span><span class="skill">Blender</span><span class="skill">VRChat Avatars</span><span class="skill">Poiyomi</span><span class="skill">HTML</span><span class="skill">CSS</span><span class="skill">JavaScript</span><span class="skill">Web UI</span><span class="skill">Texturing</span>
      </div>
      <div class="socials">
        <a class="social" href="https://vrchat.com/home/user/usr_fba85e6f-5621-4f17-8c95-c378dee67190" target="_blank" rel="noopener noreferrer" aria-label="Abrir perfil de VRChat">
          <span class="social-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="16" rx="4" stroke="currentColor" stroke-width="1.8"/><path d="M7 9.2 9.7 14 12 10.3 14.3 14 17 9.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="social-text"><small>VRChat</small><strong>Ver perfil</strong></span>
        </a>
        <div class="social" aria-label="Discord: cris__ta">
          <span class="social-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7.2 7.2c3.1-1.4 6.5-1.4 9.6 0 1.5 2 2.5 4.4 2.7 6.9-1.2 1.5-2.7 2.5-4.4 3.2l-1.1-1.5c.6-.2 1.1-.5 1.6-.8-2.3 1-4.9 1-7.2 0 .5.3 1 .6 1.6.8l-1.1 1.5c-1.7-.7-3.2-1.7-4.4-3.2.2-2.5 1.2-4.9 2.7-6.9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="9.3" cy="12.1" r="1" fill="currentColor"/><circle cx="14.7" cy="12.1" r="1" fill="currentColor"/></svg></span>
          <span class="social-text"><small>Discord</small><strong>cris__ta</strong></span>
        </div>
      </div>
    </section>
  </div>
  <div class="card-edge" aria-hidden="true"></div>
</article>
</div>
<script>
const card=document.getElementById("card");
const MAX_TILT=4.6,FOREGROUND_SHIFT=10.5,BACKGROUND_SHIFT=3.2;
let tRX=0,tRY=0,cRX=0,cRY=0,tFX=0,tFY=0,cFX=0,cFY=0,tBX=0,tBY=0,cBX=0,cBY=0,raf=0;
function render(){
  const e=.105;
  cRX+=(tRX-cRX)*e;cRY+=(tRY-cRY)*e;cFX+=(tFX-cFX)*e;cFY+=(tFY-cFY)*e;cBX+=(tBX-cBX)*e;cBY+=(tBY-cBY)*e;
  card.style.setProperty("--rx",cRX+"deg");card.style.setProperty("--ry",cRY+"deg");
  card.style.setProperty("--fg-x",cFX+"px");card.style.setProperty("--fg-y",cFY+"px");
  card.style.setProperty("--bg-x",cBX+"px");card.style.setProperty("--bg-y",cBY+"px");
  if(Math.abs(tRX-cRX)>.003||Math.abs(tRY-cRY)>.003||Math.abs(tFX-cFX)>.01||Math.abs(tFY-cFY)>.01||Math.abs(tBX-cBX)>.01||Math.abs(tBY-cBY)>.01)raf=requestAnimationFrame(render);else raf=0
}
function kick(){if(!raf)raf=requestAnimationFrame(render)}
card.addEventListener("pointermove",e=>{
  const r=card.getBoundingClientRect(),nx=((e.clientX-r.left)/r.width)-.5,ny=((e.clientY-r.top)/r.height)-.5;
  tRY=nx*MAX_TILT*2;tRX=-ny*MAX_TILT*2;
  tFX=nx*FOREGROUND_SHIFT*2;tFY=ny*FOREGROUND_SHIFT*2;
  tBX=-nx*BACKGROUND_SHIFT*2;tBY=-ny*BACKGROUND_SHIFT*2;
  card.style.setProperty("--light-x",(50+nx*24)+"%");card.style.setProperty("--light-y",(40+ny*20)+"%");
  kick()
},{passive:true});
card.addEventListener("pointerleave",()=>{tRX=tRY=tFX=tFY=tBX=tBY=0;card.style.setProperty("--light-x","50%");card.style.setProperty("--light-y","35%");kick()});
(async()=>{
  const bg=document.getElementById("crisCardBackground");
  const files=["cris-card-bg-hq-01.txt","cris-card-bg-hq-02.txt","cris-card-bg-hq-03.txt","cris-card-bg-hq-04.txt","cris-card-bg-hq-05.txt"];
  try{
    const chunks=await Promise.all(files.map(async f=>{const r=await fetch(f+"?v=cris-layers-5",{cache:"no-store"});if(!r.ok)throw new Error(f);return(await r.text()).replace(/\s+/g,"")}));
    bg.src="data:image/avif;base64,"+chunks.join("")
  }catch(err){console.error("No se pudo cargar la CAPA 2 de CRIS",err)}
})();
</script>
</body>
</html>
