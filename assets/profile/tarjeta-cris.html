<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匚尺丨丂 — Tarjeta 3D</title>

<style>
:root {
  --text: #f7f8fb;
  --muted: rgba(255,255,255,.72);
  --soft: rgba(255,255,255,.48);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.035), transparent 28%),
    #070a0f;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.scene {
  width: min(1488px, 100%);
  perspective: 1450px;
}

.card {
  --rx: 0deg;
  --ry: 0deg;
  --fg-x: 0px;
  --fg-y: 0px;
  --bg-x: 0px;
  --bg-y: 0px;

  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: 28px;

  transform-style: preserve-3d;
  transform: rotateX(var(--rx)) rotateY(var(--ry));
  will-change: transform;

  background: #0b0f15;
  box-shadow:
    0 32px 90px rgba(0,0,0,.52),
    0 0 0 1px rgba(255,255,255,.06);
}

/* ==========================================================
   CAPA 2 — FONDO
   Arceus + cielo + entorno.
   Está físicamente más atrás.
   ========================================================== */
.layer-2-background {
  position: absolute;
  inset: -1.8%;
  z-index: 1;

  width: 103.6%;
  height: 103.6%;
  object-fit: cover;
  object-position: center;

  pointer-events: none;
  user-select: none;

  transform:
    translate3d(
      var(--bg-x),
      var(--bg-y),
      -34px
    )
    scale(1.015);

  filter: saturate(.98) contrast(1.01);
  will-change: transform;
}

/* Sombra de profundidad detrás de la capa frontal */
.depth-shadow {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 31% 52%,
      rgba(0,0,0,.10) 0%,
      rgba(0,0,0,.035) 27%,
      transparent 48%
    );
}

/* ==========================================================
   CAPA 1 — DELANTE
   Incluye TU PERSONAJE + TARJETA.
   Los dos se mueven juntos para sentirse en el mismo plano.
   ========================================================== */
.layer-1 {
  position: absolute;
  inset: 0;
  z-index: 3;

  transform-style: preserve-3d;
  transform:
    translate3d(
      var(--fg-x),
      var(--fg-y),
      66px
    );

  will-change: transform;
  pointer-events: none;
}

.character {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;

  pointer-events: none;
  user-select: none;

  filter:
    drop-shadow(0 14px 16px rgba(0,0,0,.20))
    drop-shadow(0 2px 4px rgba(0,0,0,.12));
}

/* ==========================================================
   TARJETA DE DATOS — MISMA CAPA 1 QUE EL PERSONAJE
   ========================================================== */
.profile {
  position: absolute;
  right: 5.2%;
  top: 50%;
  width: min(43%, 610px);

  transform: translateY(-50%) translateZ(8px);

  padding: 27px 29px;

  border: 1px solid rgba(255,255,255,.11);
  border-radius: 24px;

  background:
    linear-gradient(
      145deg,
      rgba(7,10,16,.18),
      rgba(7,10,16,.07)
    );

  backdrop-filter: blur(3px) saturate(1.02);

  box-shadow:
    0 16px 34px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.05);

  color: var(--text);
  pointer-events: auto;
}

.kicker {
  margin: 0 0 7px;
  color: var(--soft);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .22em;
  text-transform: uppercase;
}

.title {
  margin: 0;
  font-size: clamp(44px, 5.3vw, 77px);
  line-height: .95;
  letter-spacing: -.035em;
  font-weight: 850;
  color: white;
}

.subtitle {
  margin: 10px 0 0;
  color: rgba(255,255,255,.90);
  font-size: clamp(16px, 1.8vw, 22px);
  font-weight: 750;
}

.quote {
  display: block;
  margin-top: 18px;
  padding-left: 14px;

  border-left: 2px solid rgba(255,255,255,.28);

  color: rgba(255,255,255,.78);
  font-size: 13px;
  line-height: 1.6;
  text-decoration: none;

  transition:
    color .18s ease,
    border-color .18s ease;
}

.quote:hover {
  color: #fff;
  border-left-color: rgba(255,255,255,.76);
}

.description {
  margin: 19px 0 0;
  color: rgba(255,255,255,.90);
  font-size: 15px;
  line-height: 1.6;
}

.section-label {
  margin: 21px 0 10px;
  color: rgba(255,255,255,.54);
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  font-weight: 800;
}

.skills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.skill {
  padding: 8px 11px;

  border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px;

  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.90);

  font-size: 11px;
  font-weight: 750;
}

.socials {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.social {
  min-height: 45px;
  display: inline-flex;
  align-items: center;
  gap: 10px;

  padding: 9px 13px;

  border: 1px solid rgba(255,255,255,.14);
  border-radius: 14px;

  background: rgba(255,255,255,.045);
  color: rgba(255,255,255,.92);
  text-decoration: none;

  transition:
    transform .18s ease,
    border-color .18s ease,
    background .18s ease;
}

.social:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,.30);
  background: rgba(255,255,.08);
}

.social-icon {
  width: 23px;
  height: 23px;
  flex: 0 0 23px;
}

.social-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.social-text {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
}

.social-text small {
  margin-bottom: 3px;
  color: rgba(255,255,255,.47);
  font-size: 9px;
  letter-spacing: .10em;
  text-transform: uppercase;
  font-weight: 800;
}

.social-text strong {
  color: white;
  font-size: 12px;
  font-weight: 800;
}

.card-edge {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;

  border-radius: inherit;

  box-shadow:
    inset 0 0 42px rgba(0,0,0,.15),
    inset 0 1px 0 rgba(255,255,255,.045);
}

@media (max-width: 820px) {
  body {
    padding: 15px;
  }

  .profile {
    right: 4%;
    width: 52%;
    padding: 21px;
  }

  .title {
    font-size: clamp(36px, 7vw, 60px);
  }
}

@media (max-width: 650px) {
  .card {
    aspect-ratio: 4 / 5;
  }

  .layer-2-background,
  .character {
    object-fit: cover;
    object-position: 43% center;
  }

  .profile {
    left: 5%;
    right: 5%;
    top: auto;
    bottom: 5%;
    width: auto;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card,
  .layer-1,
  .layer-2-background {
    transform: none !important;
  }
}

/* ToolHub popup embed: card only, transparent around it. */
html,body{width:100%!important;height:100%!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;background:transparent!important}
body{display:block!important}
.scene{width:100%!important;height:100%!important;max-width:none!important;display:grid!important;place-items:center!important}
.card{width:100%!important;height:100%!important;aspect-ratio:auto!important;box-shadow:none!important}
</style>
</head>

<body>

<div class="scene">
  <article class="card" id="card">

    <!-- CAPA 2: ARCEUS Y FONDO -->
    <img

      id="crisCardBackground"
      src=""
      alt=""
      aria-hidden="true"
      draggable="false"
    >

    <div class="depth-shadow" aria-hidden="true"></div>

    <!-- CAPA 1: PERSONAJE + TARJETA -->
    <div class="layer-1">

      <img
        class="character"
        id="crisCardForeground"

        alt="CRIS"

      >

      <section class="profile" aria-label="Perfil de CRIS">

        <div class="skills">

          <a

          >
            <span class="social-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="2.5" y="4" width="19" height="16" rx="4"
                  stroke="currentColor" stroke-width="1.8"/>

          <div class="social" aria-label="Discord: cris__ta">

                  stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>

    <div class="card-edge" aria-hidden="true"></div>

<script>
const card = document.getElementById("card");

const MAX_TILT = 3.1;
const FOREGROUND_SHIFT = 5.0;
const BACKGROUND_SHIFT = 1.4;

let targetRX = 0;
let targetRY = 0;
let currentRX = 0;
let currentRY = 0;

let targetFGX = 0;
let targetFGY = 0;
let currentFGX = 0;
let currentFGY = 0;

let targetBGX = 0;
let targetBGY = 0;
let currentBGX = 0;
let currentBGY = 0;

let raf = null;

function animate() {
  const ease = 0.095;

  currentRX += (targetRX - currentRX) * ease;
  currentRY += (targetRY - currentRY) * ease;

  currentFGX += (targetFGX  - currentFGX) * ease;
  currentFGY += (targetFGY - currentFGY) * ease;

  currentBGX += (targetBGX - currentBGX) * ease;
  currentBGY += (targetBGY - currentBGY) * ease;

  card.style.setProperty("--rx", currentRX + "deg");
  card.style.setProperty("--ry", currentRY + "deg");

  card.style.setProperty("--fg-x", currentFGX + "px");
  card.style.setProperty("--fg-y", currentFGY + "px");

  card.style.setProperty("--bg-x", currentBGX + "px");
  card.style.setProperty("--bg-y", currentBGY + "px");

  const moving =
    Math.abs(targetRX - currentRX) > .004 ||
    Math.abs(targetRY - currentRY) > .004 ||
    Math.abs(targetFGX - currentFGX) > .01 ||
    Math.abs(targetFGY - currentFGY) > .01 ||
    Math.abs(targetBGX - currentBGX) > .01 ||
    Math.abs(targetBGY - currentBGY) > .01;

  if (moving) {
    raf = requestAnimationFrame(animate);
  } else {
    raf = null;
  }
}

function requestRender() {
  if (!raf) raf = requestAnimationFrame(animate);
}

card.addEventListener("mousemove", (event) => {
  const rect = card.getBoundingClientRect();

  const x = (event.clientX - rect.left) / rect.width;
  const y = (event.clientY - rect.top) / rect.height;

  const nx = x - .5;
  const ny = y - .5;

  /* Giro general */
  targetRY = nx * MAX_TILT * 2;
  targetRX = -ny * MAX_TILT * 2;

  /*
    CAPA 1 se mueve ligeramente más.
    CAPA 2 se mueve en sentido contrario y mucho menos.
  */
  targetFGX = nx * FOREGROUND_SHIFT * 2;
  targetFGY = ny * FOREGROUND_SHIFT * 2;

  targetBGX = -nx * BACKGROUND_SHIFT * 2;
  targetBGY = -ny * BACKGROUND_SHIFT * 2;

  requestRender();
});

card.addEventListener("mouseleave", () => {
  targetRX = 0;
  targetRY = 0;

  targetFGX = 0;
  targetFGY = 0;

  targetBGX = 0;
  targetBGY = 0;

  requestRender();
});


/* GitHub Pages: reconstruct both visual layers from text chunks.
   CAPA 2 = full Arceus/background image.
   CAPA 1 = exact foreground region selected by the user, with alpha. */
async function loadLayerBase64(parts) {
  const chunks = await Promise.all(parts.map(async (file) => {
    const response = await fetch(`${file}?v=cris-layers-4`, { cache: "no-store" });
    if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
    return (await response.text()).replace(/\s+/g, "");
  }));
  return chunks.join("");
}

(async () => {
  const background = document.getElementById("crisCardBackground");
  const foreground = document.getElementById("crisCardForeground");

  try {
    const [background64, foreground64] = await Promise.all([
      loadLayerBase64([
        "cris-card-bg-hq-01.txt",
        "cris-card-bg-hq-02.txt",
        "cris-card-bg-hq-03.txt",
        "cris-card-bg-hq-04.txt",
        "cris-card-bg-hq-05.txt"
      ]),
      loadLayerBase64(["cris-card-bg-hq-06.txt"])
    ]);

    background.src = `data:image/avif;base64,${background64}`;
    foreground.src = `data:image/avif;base64,${foreground64}`;
  } catch (error) {
    console.error("No se pudieron cargar las dos capas visuales de la tarjeta CRIS.", error);
  }
})();
</script>
